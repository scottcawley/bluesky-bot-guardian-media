name: RSS to Bluesky
on:
  schedule:
    - cron: '*/30 * * * *' # Checks every 30 mins
  workflow_dispatch:     # Allows manual testing

jobs:
  rss-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # This gives the bot a memory so it doesn't post the same news twice
      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: bsky-cache.json
          key: bsky-rss-cache-${{ github.run_id }}
          restore-keys: |
            bsky-rss-cache-

      - name: Post to Bluesky
        uses: joschi/blueskyfeedbot@v0.0.6
        with:
          rss-feed: 'https://www.theguardian.com/uk/media/rss'
          username: ${{ secrets.BSKY_HANDLE }}
          password: ${{ secrets.BSKY_PASSWORD }}
          cache-file: bsky-cache.json
