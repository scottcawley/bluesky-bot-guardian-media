name: Sleek Multi-Bot Automator
on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # <--- THIS IS THE MAGIC FIX
      fail-fast: false # Keeps other bots running if one fails
      matrix:
        include:
          - name: "Guardian Media"
            handle: "BSKY_HANDLE"
            pass: "BSKY_PASSWORD"
            rss: "https://www.theguardian.com/uk/media/rss"

          - name: "Guardian Technology"
            handle: "BSKY_HANDLE_TECH_G"
            pass: "BSKY_PASS_TECH_G"
            rss: "https://www.theguardian.com/uk/technology/rss"

          - name: "Guardian TV & Radio"
            handle: "BSKY_HANDLE_TV_G"
            pass: "BSKY_PASS_TV_G"
            rss: "https://www.theguardian.com/uk/tv-and-radio/rss"

          - name: "BBC Technology"
            handle: "BSKY_HANDLE_TECH_B"
            pass: "BSKY_PASS_TECH_B"
            rss: "https://feeds.bbci.co.uk/news/technology/rss.xml"

          - name: "BBC Entertainment"
            handle: "BSKY_HANDLE_ENT_B"
            pass: "BSKY_PASS_ENT_B"
            rss: "https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"

    name: ${{ matrix.name }} # This labels each run in your Actions tab
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install atproto feedparser beautifulsoup4 requests lxml

      - name: Run Bot Logic
        env:
          BSKY_HANDLE: ${{ secrets[matrix.handle] }}
          BSKY_PASSWORD: ${{ secrets[matrix.pass] }}
          RSS_URL: ${{ matrix.rss }}
        run: |
          python - <<EOF
          import os, feedparser, requests, re
          from atproto import Client, models, Request
          from bs4 import BeautifulSoup
          from httpx import Timeout

          client = Client(request=Request(timeout=Timeout(30.0)))
          client.login(os.environ['BSKY_HANDLE'], os.environ['BSKY_PASSWORD'])
          
          # 1. Deduplication
          profile_feed = client.get_author_feed(actor=os.environ['BSKY_HANDLE'], limit=1)
          last_link_on_bsky = ""
          if profile_feed.feed:
              last_post = profile_feed.feed[0].post
              if last_post.embed and hasattr(last_post.embed, 'external'):
                  last_link_on_bsky = last_post.embed.external.uri

          # 2. Check RSS
          feed = feedparser.parse(os.environ['RSS_URL'])
          if not feed.entries: exit()
          entry = feed.entries[0]

          if entry.link == last_link_on_bsky:
              print(f"Skipping {os.environ['BSKY_HANDLE']} - Already posted.")
          else:
              # 3. Content Extraction
              raw_desc = entry.get('summary', entry.get('description', ''))
              soup = BeautifulSoup(raw_desc, 'html.parser')
              first_p = soup.find('p')
              clean_desc = first_p.get_text(strip=True) if first_p else soup.get_text(separator=' ').strip()[:200]
              clean_desc = re.sub(r'\s+', ' ', clean_desc)

              # 4. Scrape Image
              embed = None
              try:
                  page = requests.get(entry.link, timeout=10)
                  soup_page = BeautifulSoup(page.content, 'html.parser')
                  og_image = soup_page.find("meta", property="og:image")
                  if og_image:
                      img_data = requests.get(og_image["content"]).content
                      upload = client.upload_blob(img_data)
                      embed = models.AppBskyEmbedExternal.Main(
                          external=models.AppBskyEmbedExternal.External(
                              title=entry.title,
                              description=clean_desc,
                              uri=entry.link,
                              thumb=upload.blob
                          )
                      )
              except Exception as e:
                  print(f"Image scrape failed: {e}")

              # 5. Post
              client.send_post(text=entry.title, embed=embed)
              print(f"Success for {os.environ['BSKY_HANDLE']}: {entry.title}")
          EOF
