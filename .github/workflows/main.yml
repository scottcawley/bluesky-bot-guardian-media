name: RSS to Bluesky Pro (Final)
on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch:     # For your manual testing

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # Bumped to v6 for Node 24 support

      - name: Set up Python
        uses: actions/setup-python@v6 # Bumped to v6 for Node 24 support
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install atproto feedparser beautifulsoup4 requests lxml

      - name: Run Bot
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          RSS_URL: 'https://www.theguardian.com/uk/media/rss'
        run: |
          python - <<EOF
          import os, feedparser, requests, re
          from atproto import Client, models, client_utils
          from bs4 import BeautifulSoup

          client = Client()
          client.login(os.environ['BSKY_HANDLE'], os.environ['BSKY_PASSWORD'])
          
          # 1. Deduplication: Peek at last post
          profile_feed = client.get_author_feed(actor=os.environ['BSKY_HANDLE'], limit=1)
          last_link_on_bsky = ""
          if profile_feed.feed:
              last_post = profile_feed.feed[0].post
              if last_post.embed and hasattr(last_post.embed, 'external'):
                  last_link_on_bsky = last_post.embed.external.uri

          # 2. Check RSS
          feed = feedparser.parse(os.environ['RSS_URL'])
          if not feed.entries: exit()
          entry = feed.entries[0]

          if entry.link == last_link_on_bsky:
              print(f"Skipping: {entry.title} - already on profile.")
          else:
              # 3. Text Scrubbing (Removes <p> tags and cleans up whitespace)
              raw_desc = entry.get('summary', entry.get('description', ''))
              soup = BeautifulSoup(raw_desc, 'html.parser')
              
              # Remove links like "Continue reading"
              for a in soup.find_all('a'): a.decompose()
              
              # Get text and clean up whitespace/newlines
              clean_text = soup.get_text(separator=' ').strip()
              clean_text = re.sub(r'\s+', ' ', clean_text)
              
              # Smart truncation (Max 300 chars, try to end at a sentence)
              max_len = 300
              if len(clean_text) > max_len:
                  truncated = clean_text[:max_len]
                  last_period = truncated.rfind('.')
                  clean_desc = truncated[:last_period + 1] if last_period > 150 else truncated.rsplit(' ', 1)[0] + '...'
              else:
                  clean_desc = clean_text

              # 4. Scrape Image & Create Link Card
              embed = None
              try:
                  page = requests.get(entry.link, timeout=10)
                  soup_page = BeautifulSoup(page.content, 'html.parser')
                  og_image = soup_page.find("meta", property="og:image")
                  if og_image:
                      img_data = requests.get(og_image["content"]).content
                      upload = client.upload_blob(img_data)
                      embed = models.AppBskyEmbedExternal.Main(
                          external=models.AppBskyEmbedExternal.External(
                              title=entry.title,
                              description=clean_desc,
                              uri=entry.link,
                              thumb=upload.blob
                          )
                      )
              except Exception as e:
                  print(f"Image scrape failed: {e}")

              # 5. Send Post with clickable Blue Link
              tb = client_utils.TextBuilder()
              tb.text(f"{entry.title}\n\n")
              tb.link("Read more on The Guardian", entry.link)

              client.send_post(tb, embed=embed)
              print(f"Posted: {entry.title}")
          EOF
